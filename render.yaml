services:
  - type: web
    name: llm-router
    runtime: node
    plan: starter # $7/mo, no spin-down. Change to "free" if you accept ~1 min cold starts.
    region: frankfurt
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: API_KEYS
        sync: false # your own key(s), comma-separated
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: MELIOUS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
